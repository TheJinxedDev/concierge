[project]
name = "taste-database"
version = "0.1.16.dev1"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "fastmcp>=3.0,<4",
    "pydantic>=2.13.4",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
